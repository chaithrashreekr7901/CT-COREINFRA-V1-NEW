version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.9
      nodejs: 18
    commands:
      - pip install -r requirements.txt
      - npm install -g aws-cdk
      
  pre_build:
    commands:
      - pip install pytest
      - pytest
      
  build:
    commands:
      - cdk synth
      - cdk deploy --all --require-approval never
      
artifacts:
  files:
    - cdk.out/**/*
    - cdk.json
    - package.json
    - requirements.txt
    - '**/*.py'